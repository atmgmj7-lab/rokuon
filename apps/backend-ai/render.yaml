# Render Blueprint - https://render.com/docs/blueprint-spec
services:
  - type: web
    name: hybrid-scouter-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OLLAMA_HOST
        value: ""
      - key: PORT
        value: "8765"
